name: MyPlanner+ Automated Testing

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run JavaScript Linter
        run: npx --yes eslint@9 js/budgetCalculator.js tests/budgetCalculator.test.js

      - name: Run JavaScript Tests
        run: node --test tests/budgetCalculator.test.js

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Test PHP login syntax
        run: |
          find . -type f -name "*.php" \
            -not -path "./vendor/*" \
            -print0 | xargs -0 -r -n1 php -l
