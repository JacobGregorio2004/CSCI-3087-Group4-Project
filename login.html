<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — MyPlanner+</title>
  <link rel="stylesheet" href="css/auth.css">
  <script defer src="js/api.js"></script>
  <script defer src="js/auth.js"></script>
</head>
<body>
  <main class="auth-card">
    <h1>MyPlanner<span>+</span></h1>
    <h2>Welcome back!</h2>
    <form id="authForm" data-action="login">
      <label for="email">Username or email</label>
      <input id="email" type="text" maxlength="100" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button type="submit">Log in</button>
      <p id="authMessage" role="alert" aria-live="polite"></p>
    </form>
    <p>New here? <a href="signup.html">Create an account</a></p>
  </main>
</body>
</html>
